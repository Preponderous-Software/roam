<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roam 3D Spectator</title>
<link rel="icon" href="data:,">
<!--
  Roam 3D spectator (RFC 0017 stage 1). Served by Roam's own read-only REST
  server at /spectator/ when restEnabled is true, so it is same-origin with
  /api/v1/snapshot and needs no CORS. It only ever GETs: it cannot change the
  game or its saves. Sprites come from the game's own /assets/images/.
-->
<style>
  :root {
    --panel: rgba(16, 20, 28, 0.82);
    --ink: #eef2f6;
    --muted: #9aa7b6;
    --accent: #f2b13a;
    --line: rgba(255, 255, 255, 0.12);
    --warn: #ff9b7a;
  }
  html, body { margin: 0; height: 100%; background: #0d1117; color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; max-width: 300px; }
  #hud h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  #status { color: var(--muted); margin: 0 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  #status.err { color: var(--warn); }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  select { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font: inherit; }
  button { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  #phase { color: var(--accent); }
  #tip { bottom: 12px; left: 12px; color: var(--muted); font-size: 12px; max-width: 520px; }
  #tip b { color: var(--ink); font-weight: 600; }
  #pick { top: 12px; right: 12px; min-width: 180px; max-width: 260px; display: none; }
  #pick .k { color: var(--muted); }
  @media (max-width: 600px) {
    #hud { left: 8px; right: 8px; top: 8px; max-width: none; padding: 8px 10px; }
    #tip { left: 8px; right: 8px; bottom: 8px; }
    #pick { top: auto; bottom: 64px; right: 8px; left: 8px; max-width: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="panel">
  <h1>Roam 3D &middot; spectator</h1>
  <p id="status">Connecting&hellip;</p>
  <div class="row">
    <span id="phase"></span>
    <label>Rooms around player
      <select id="radius" aria-label="Rooms around the player">
        <option value="0">0</option><option value="1">1</option>
        <option value="2" selected>2</option><option value="3">3</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label><input id="follow" type="checkbox" checked> Follow player</label>
    <button id="home">Recentre</button>
  </div>
</div>
<div id="pick" class="panel"></div>
<div id="tip" class="panel"><b>Drag</b> to orbit &middot; <b>right-drag / two fingers</b> to pan &middot; <b>wheel / pinch</b> to zoom &middot; <b>hover / tap</b> a tile to inspect</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="/web/roam3d.js"></script>
<script>
"use strict";
// Polls GET /api/v1/snapshot and hands each snapshot to the shared Roam 3D
// scene (web/roam3d.js, also used by the browser game's ?view=3d). The scene
// rebuilds a room's terrain only when its terrain changes; cards (things that
// move) are redrawn on every poll.
const API = "/api/v1/snapshot";
const POLL_MS = 500;
const $ = id => document.getElementById(id);
const hooks = window.__roam3d = { polls: 0, lastTick: null, error: null };
const scene = Roam3DScene.create({
  canvas: $("c"), orbit: true, hooks, followOffset: [26, 30, 40],
  onApplied(s, info) {
    const dn = s.dayNight;
    $("phase").textContent = dn.enabled ? dn.phase : "day/night off";
    $("status").className = "";
    $("status").textContent = `tick ${s.tick} · ${info.rooms} room(s)` +
      (info.viewZ < 0 ? ` · cave level ${info.viewZ}` : "") + ` · ${info.lights} light(s)`;
  },
});

let radius = 2;
try { const saved = localStorage.getItem("roam3d.radius"); if (saved !== null) radius = Math.max(0, Math.min(3, parseInt(saved, 10) || 0)); } catch (e) { /* storage unavailable */ }
$("radius").value = String(radius);
$("radius").onchange = e => { radius = parseInt(e.target.value, 10); try { localStorage.setItem("roam3d.radius", String(radius)); } catch (err) { /* ignore */ } };
async function poll() {
  try {
    const res = await fetch(`${API}?radius=${radius}`, { cache: "no-store" });
    const body = await res.json();
    // The game builds views only while someone polls, so the first poll (or
    // one after a pause) can arrive before a view exists: just poll again.
    if (res.status === 503 && hooks.polls === 0 && !hooks.error) { setTimeout(poll, 150); return; }
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    scene.apply(body);
    hooks.polls++; hooks.lastTick = body.tick; hooks.error = null;
  } catch (err) {
    hooks.error = String(err.message || err);
    $("status").className = "err";
    $("status").textContent = `Waiting for Roam: ${hooks.error}. Open a world with restEnabled: true.`;
  }
  setTimeout(poll, POLL_MS);
}

$("follow").onchange = e => scene.setFollow(e.target.checked);
$("home").onclick = () => scene.recentre();
function showPick(ev) {
  const box = $("pick"), hit = scene.pick(ev.clientX, ev.clientY);
  if (!hit) { box.style.display = "none"; return; }
  const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  box.innerHTML = `<div><span class="k">room</span> (${hit.room.x}, ${hit.room.y}, ${hit.room.z}) &middot; ${esc(hit.room.biome)}</div>` +
    `<div><span class="k">tile</span> (${hit.tile[0]}, ${hit.tile[1]})</div>` +
    `<div><span class="k">entities</span> ${hit.entities.length ? esc(hit.entities.join(", ")) : "(empty)"}</div>`;
  box.style.display = "block";
}
const canvas = $("c");
canvas.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse" && ev.buttons === 0) showPick(ev); });
canvas.addEventListener("pointerup", ev => { if (ev.pointerType !== "mouse") showPick(ev); });
poll();
</script>
</body>
</html>
